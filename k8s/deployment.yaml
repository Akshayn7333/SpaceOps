apiVersion: apps/v1
kind: Deployment
metadata:
  name: spaceops
  labels:
    app: spaceops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: spaceops
  template:
    metadata:
      labels:
        app: spaceops
    spec:
      containers:
        - name: spaceops
          image: spaceops:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
